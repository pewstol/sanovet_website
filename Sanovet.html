<style>
/* Layout concept: calm Baltic-coast clinic page. Sticky header, wave-lined hero, quick-action cards, services grid, visit steps, FAQ, contact with map link card. */
:root {
  --bg: #f2f6f6;
  --surface: #ffffff;
  --fg: #0c2f35;
  --muted: #4b6a6f;
  --line: #d4e1e1;
  --sea: #11646c;
  --sea-soft: #dcecec;
  --accent: #f0b429;
  --accent-fg: #0c2f35;
  --hero-bg: #0c3d44;
  --hero-fg: #eef7f6;
  --hero-muted: #a8cccb;
  --font-display: "Unbounded", "Manrope", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1d21; --surface: #112a2f; --fg: #e5f0ef; --muted: #98b8b8; --line: #1f3d42;
    --sea: #6cc3c8; --sea-soft: #14363b; --accent: #f0b429; --accent-fg: #0c2f35;
    --hero-bg: #071418; --hero-fg: #eef7f6; --hero-muted: #8fb5b5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a1d21; --surface: #112a2f; --fg: #e5f0ef; --muted: #98b8b8; --line: #1f3d42;
  --sea: #6cc3c8; --sea-soft: #14363b; --accent: #f0b429; --accent-fg: #0c2f35;
  --hero-bg: #071418; --hero-fg: #eef7f6; --hero-muted: #8fb5b5;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-block: 0;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 500; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { background: var(--hero-bg); color: var(--hero-muted); font-size: 13px; }
.topbar .wrap { display: flex; flex-wrap: wrap; gap: 4px 20px; justify-content: space-between; padding-block: 8px; }
.topbar b { color: var(--hero-fg); font-weight: 600; }

/* header */
.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.header .wrap { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 600; font-size: 20px; letter-spacing: 0.02em; }
.brand svg { width: 32px; height: 32px; color: var(--sea); flex: none; }
.nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; min-width: 0; }
.nav a { text-decoration: none; padding: 8px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--muted); }
.nav a:hover { color: var(--fg); background: var(--sea-soft); }
.lang { display: flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; border: 0; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
@media (max-width: 760px) {
  .nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; flex-wrap: nowrap; }
  .nav a { white-space: nowrap; }
  .lang { margin-left: auto; }
}

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; font: inherit; font-weight: 700; font-size: 15px; text-decoration: none; padding: 13px 22px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { filter: brightness(1.06); }
.btn-ghost { border-color: color-mix(in srgb, var(--hero-fg) 45%, transparent); color: var(--hero-fg); }
.btn-ghost:hover { background: color-mix(in srgb, var(--hero-fg) 12%, transparent); }
.btn-line { border-color: var(--line); color: var(--fg); background: var(--surface); }
.btn-line:hover { border-color: var(--sea); }

/* hero */
.hero { background: var(--hero-bg); color: var(--hero-fg); position: relative; overflow: hidden; }
.hero .wrap { position: relative; z-index: 1; padding-block: 72px 112px; display: grid; gap: 28px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); }
.hero h1 { font-size: clamp(30px, 5.2vw, 56px); max-width: 17ch; }
.hero p.lead { font-size: clamp(16px, 2vw, 19px); color: var(--hero-muted); max-width: 56ch; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; }
.waves { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 120px; z-index: 0; display: block; }
.waves path { fill: none; stroke-width: 1.5; }
.hero-mark { position: absolute; right: max(16px, 4vw); top: 50%; transform: translateY(-50%); width: min(300px, 32vw); color: var(--hero-fg); opacity: 0.08; z-index: 0; }
@media (max-width: 760px) { .hero-mark { display: none; } .hero .wrap { padding-block: 48px 96px; } }

/* quick cards */
.quick { margin-top: -56px; position: relative; z-index: 2; }
.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; display: grid; gap: 10px; align-content: start; min-width: 0; box-shadow: 0 10px 30px -18px rgba(8, 40, 46, 0.35); }
.qcard .ico { width: 44px; height: 44px; border-radius: 12px; background: var(--sea-soft); color: var(--sea); display: grid; place-items: center; }
.qcard .ico svg { width: 24px; height: 24px; }
.qcard h3 { font-size: 17px; }
.qcard p { color: var(--muted); font-size: 15px; }

/* sections */
section { padding-block: 84px 0; }
.sec-head { display: grid; gap: 12px; margin-bottom: 36px; max-width: 62ch; }
.sec-head .eyebrow { color: var(--sea); }
.sec-head h2 { font-size: clamp(26px, 3.6vw, 38px); }
.sec-head p { color: var(--muted); }

/* services */
.services { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.svc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.svc svg { width: 28px; height: 28px; color: var(--sea); }
.svc h3 { font-size: 16px; font-family: var(--font-body); font-weight: 700; letter-spacing: 0; }
.svc p { color: var(--muted); font-size: 15px; }
.animals { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.animals span.lbl { font-weight: 700; margin-right: 4px; }
.chip { background: var(--sea-soft); color: var(--sea); font-weight: 700; font-size: 14px; padding: 8px 16px; border-radius: 999px; }

/* about + steps */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; gap: 32px; } }
.split > * { min-width: 0; }
.about-text { display: grid; gap: 16px; color: var(--muted); font-size: 17px; }
.about-text h2 { color: var(--fg); font-size: clamp(26px, 3.6vw, 38px); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; counter-reset: s; border-left: 2px solid var(--line); margin-left: 14px; }
.steps li { position: relative; padding: 0 0 26px 30px; counter-increment: s; }
.steps li:last-child { padding-bottom: 0; }
.steps li::before { content: counter(s); position: absolute; left: -15px; top: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--sea); color: var(--bg); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
.steps b { display: block; font-size: 16px; }
.steps span { color: var(--muted); font-size: 15px; }
.steps-title { font-family: var(--font-display); font-weight: 500; font-size: 20px; margin-bottom: 22px; }

/* faq */
.faq { display: grid; gap: 10px; max-width: 820px; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 20px; }
summary { cursor: pointer; font-weight: 700; padding: 16px 0; list-style: none; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 22px; line-height: 1; color: var(--sea); flex: none; }
details[open] summary::after { content: "–"; }
details p { color: var(--muted); padding-bottom: 18px; }

/* contact */
.contact-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
@media (max-width: 820px) { .contact-grid { grid-template-columns: 1fr; } }
.contact-grid > * { min-width: 0; }
.clist { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 24px; }
.crow { display: grid; grid-template-columns: 120px 1fr; gap: 6px 16px; padding: 18px 0; border-bottom: 1px solid var(--line); align-items: start; }
.crow:last-child { border-bottom: 0; }
@media (max-width: 480px) { .crow { grid-template-columns: 1fr; } }
.crow dt { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.crow dd { margin: 0; font-size: 17px; font-weight: 600; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; min-width: 0; overflow-wrap: anywhere; }
.copy { font: inherit; font-size: 12px; font-weight: 700; border: 1px solid var(--line); background: var(--bg); color: var(--muted); padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.copy:hover { color: var(--fg); border-color: var(--sea); }
.ph { border-bottom: 2px dashed var(--accent); }
.mapcard { border-radius: 16px; overflow: hidden; background: var(--sea-soft); border: 1px solid var(--line); display: grid; grid-template-rows: 1fr auto; min-height: 340px; }
.mapart { position: relative; min-height: 200px; }
.mapart svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mapart .roads { stroke: var(--surface); }
.mapart .water { fill: color-mix(in srgb, var(--sea) 22%, transparent); }
.mapart .pin { fill: var(--accent); stroke: var(--accent-fg); }
.mapinfo { background: var(--surface); padding: 20px 22px; display: grid; gap: 14px; }
.mapinfo strong { font-size: 17px; }
.mapinfo .btns { display: flex; flex-wrap: wrap; gap: 10px; }
.mapinfo .btn { padding: 10px 18px; font-size: 14px; }
.note { margin-top: 16px; font-size: 13px; color: var(--muted); }
.note span { border-bottom: 2px dashed var(--accent); }

/* footer */
footer { margin-top: 96px; background: var(--hero-bg); color: var(--hero-muted); }
footer .wrap { padding-block: 40px; display: flex; flex-wrap: wrap; gap: 16px 32px; justify-content: space-between; align-items: center; font-size: 14px; }
footer .brand { color: var(--hero-fg); font-size: 18px; }
footer .brand svg { color: var(--accent); }
footer a { text-decoration: none; }
footer a:hover { color: var(--hero-fg); }

@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
